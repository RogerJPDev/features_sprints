<!DOCTYPE html>
<html lang="es">
  <head>
    <title>Portfolio RJP</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--font family -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <!--links a los archivos css-->
    <link rel="stylesheet" href="./css/reset.css"/>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <div id="header"></div>
  <main class="principal">
    <h2 class="titulillo">Contacto</h2>
    <p class="textoLargo">¿Tienes alguna pregunta o propuesta? Rellena el formulario y me pondré en contacto contigo lo antes posible.</p>
    <form class="captureInformation" action= "/captura de datos" method="POST">
      <fieldset class="datospersonales">
        <legend>Datos personales</legend>
        <div class="cajaCampos">
          <label class="etiquetaDelCampo" for="nombre">Nombre</label>
          <input class="inputField" type="text" id="nombre" name="nombre" placeholder="Tu nombre" required />
        </div>
        <div class="cajaCampos">
          <label class="etiquetaDelCampo" for= "email">Email</label>
          <input class="inputField" type="email" id="email" name="email" placeholder="tu_email@tuemail.com" required />
        </div>
        <div class="cajaCampos">
          <label class="etiquetaDelCampo" for="asunto">Asunto</label>
          <input class="inputField" type="text" id="asunto" name="asunto" placeholder="Asunto del mensaje" required />
        </div>
        <div  class="cajaCampos">
          <label class="etiquetaDelCampo" for= "mensaje">Mensaje</label>
          <textarea class="textBox" id="mensaje" name="mensaje" rows="10" placeholder="Deja tu mensaje aqui..." required></textarea>
        </div>
        <button class="submitButton" type="submit">Enviar mensaje</button>
        <button class="resetButton" type="reset">Borrar campos</button>
    </fieldset>
    </form>
    <section>
        <p class="firma"> Spread the <span class="corazon" role="img" aria-label="love">❤</span> by Roger </p>
      </section>
    </main>
    <div id="footer"></div>
    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/utils.js"></script>
  </body>
</html>
